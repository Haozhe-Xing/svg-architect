<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="svga-bento-title svga-bento-desc" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, system-ui, sans-serif">
