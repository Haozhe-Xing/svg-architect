<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="svga-clean-title svga-clean-desc" font-family="Segoe UI, PingFang SC, Noto Sans SC, Microsoft YaHei, system-ui, sans-serif">
  <title id="svga-clean-title">Transformer 层结构教学图</title>
  <desc id="svga-clean-desc">干净教学风示例：用浅色卡片、柔和分区和红色虚线残差连接解释 Transformer 层结构。</desc>
  <defs>
    <marker id="svga-clean-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563EB"/>
    </marker>
    <filter id="svga-clean-card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="680" height="520" fill="#F8FAFC"/>

  <!-- 标题区 -->
  <text x="24" y="42" font-size="18" font-weight="700" fill="#1E293B">Transformer 层结构教学图</text>
  <text x="24" y="62" font-size="12" fill="#475569">Soft Card · 主流程清晰 · 残差连接显式标注</text>

  <!-- 图例 -->
  <rect x="414" y="28" width="10" height="10" rx="2" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="430" y="38" font-size="12" fill="#475569">Attention</text>
  <rect x="504" y="28" width="10" height="10" rx="2" fill="#D1FAE5" stroke="#059669"/>
  <text x="520" y="38" font-size="12" fill="#475569">FFN</text>
  <line x1="584" y1="34" x2="612" y2="34" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="618" y="38" font-size="12" fill="#475569">残差</text>

  <!-- 结论条 -->
  <rect x="24" y="78" width="632" height="34" rx="8" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#svga-clean-card-shadow)"/>
  <rect x="36" y="88" width="3" height="14" rx="1" fill="#2563EB"/>
  <text x="48" y="100" font-size="13" fill="#1E293B">一层 Transformer = Attention 子层 + FFN 子层，每个子层前后都有 Norm 与残差路径。</text>

  <!-- 左侧旁注 -->
  <rect x="24" y="134" width="160" height="138" rx="10" fill="#FEF3C7" stroke="#F59E0B"/>
  <text x="40" y="160" font-size="14" font-weight="600" fill="#92400E">读图顺序</text>
  <text x="40" y="184" font-size="12" fill="#475569">1. 从底部输入开始</text>
  <text x="40" y="206" font-size="12" fill="#475569">2. 沿蓝色箭头向上</text>
  <text x="40" y="228" font-size="12" fill="#475569">3. 红虚线表示跳连</text>
  <text x="40" y="250" font-size="12" fill="#475569">4. 右侧解释模块替换</text>

  <rect x="24" y="292" width="160" height="112" rx="10" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="40" y="318" font-size="14" font-weight="600" fill="#5B21B6">为什么干净</text>
  <text x="40" y="342" font-size="12" fill="#475569">浅色背景</text>
  <text x="40" y="364" font-size="12" fill="#475569">低饱和分区</text>
  <text x="40" y="386" font-size="12" fill="#475569">主流程优先</text>

  <!-- 中央分区 -->
  <rect x="208" y="132" width="232" height="160" rx="12" fill="#DBEAFE" stroke="#BFDBFE"/>
  <text x="224" y="156" font-size="13" font-weight="600" fill="#1E3A8A">Attention 子层</text>

  <rect x="208" y="308" width="232" height="150" rx="12" fill="#D1FAE5" stroke="#A7F3D0"/>
  <text x="224" y="332" font-size="13" font-weight="600" fill="#065F46">FFN 子层</text>

  <!-- 主流程节点 -->
  <rect x="258" y="430" width="132" height="34" rx="8" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#svga-clean-card-shadow)"/>
  <text x="324" y="452" font-size="13" fill="#1E293B" text-anchor="middle">输入 hidden states</text>

  <rect x="258" y="370" width="132" height="34" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" filter="url(#svga-clean-card-shadow)"/>
  <text x="324" y="392" font-size="13" fill="#5B21B6" text-anchor="middle">RMSNorm</text>

  <rect x="250" y="196" width="148" height="42" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" filter="url(#svga-clean-card-shadow)"/>
  <text x="324" y="214" font-size="13" font-weight="600" fill="#1E3A8A" text-anchor="middle">Self Attention</text>
  <text x="324" y="231" font-size="12" fill="#475569" text-anchor="middle">Q · K · V · RoPE</text>

  <rect x="258" y="146" width="132" height="34" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" filter="url(#svga-clean-card-shadow)"/>
  <text x="324" y="168" font-size="13" fill="#5B21B6" text-anchor="middle">RMSNorm</text>

  <rect x="250" y="320" width="148" height="42" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.5" filter="url(#svga-clean-card-shadow)"/>
  <text x="324" y="338" font-size="13" font-weight="600" fill="#065F46" text-anchor="middle">Feed Forward</text>
  <text x="324" y="355" font-size="12" fill="#475569" text-anchor="middle">SwiGLU / MLP</text>

  <rect x="258" y="92" width="132" height="34" rx="8" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#svga-clean-card-shadow)"/>
  <text x="324" y="114" font-size="13" fill="#1E293B" text-anchor="middle">输出到下一层</text>

  <!-- 主流程箭头 -->
  <line x1="324" y1="430" x2="324" y2="406" stroke="#2563EB" stroke-width="1.8" marker-end="url(#svga-clean-arrow)"/>
  <line x1="324" y1="370" x2="324" y2="364" stroke="#2563EB" stroke-width="1.8" marker-end="url(#svga-clean-arrow)"/>
  <line x1="324" y1="320" x2="324" y2="240" stroke="#2563EB" stroke-width="1.8" marker-end="url(#svga-clean-arrow)"/>
  <line x1="324" y1="196" x2="324" y2="182" stroke="#2563EB" stroke-width="1.8" marker-end="url(#svga-clean-arrow)"/>
  <line x1="324" y1="146" x2="324" y2="128" stroke="#2563EB" stroke-width="1.8" marker-end="url(#svga-clean-arrow)"/>

  <!-- 残差连接 -->
  <path d="M390 447 C450 447 450 343 400 343" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="452" y="396" font-size="12" fill="#991B1B">残差连接</text>

  <path d="M398 217 C456 217 456 164 392 164" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="452" y="194" font-size="12" fill="#991B1B">残差连接</text>

  <!-- 右侧说明 -->
  <rect x="464" y="134" width="192" height="122" rx="10" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#svga-clean-card-shadow)"/>
  <text x="480" y="160" font-size="14" font-weight="600" fill="#1E293B">模块演进</text>
  <text x="480" y="184" font-size="12" fill="#475569">LayerNorm → RMSNorm</text>
  <text x="480" y="206" font-size="12" fill="#475569">位置编码 → RoPE</text>
  <text x="480" y="228" font-size="12" fill="#475569">MLP → SwiGLU FFN</text>

  <rect x="464" y="276" width="192" height="128" rx="10" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#svga-clean-card-shadow)"/>
  <text x="480" y="302" font-size="14" font-weight="600" fill="#1E293B">N 层堆叠</text>
  <text x="480" y="326" font-size="12" fill="#475569">每层结构相同</text>
  <text x="480" y="348" font-size="12" fill="#475569">参数独立学习</text>
  <text x="480" y="370" font-size="12" fill="#475569">逐层抽象语义</text>
  <rect x="480" y="382" width="152" height="8" rx="4" fill="#DBEAFE"/>
  <rect x="480" y="382" width="112" height="8" rx="4" fill="#2563EB"/>

  <!-- 脚注 -->
  <text x="24" y="500" font-size="12" fill="#64748B">* 示例仅说明 clean_teaching 风格：柔和分区、卡片节点、主流程优先、残差显式标注。</text>
</svg>
